name: Build and Package

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

jobs:
    build-windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pyinstaller

            - name: Build with PyInstaller
              run: |
                  pyinstaller --name="TransCreeper" ^
                              --windowed ^
                              --onefile ^
                              --icon=resources/icon.ico ^
                              --add-data="resources;resources" ^
                              src/main.py

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v4
              with:
                  name: TransCreeper-Windows
                  path: dist/TransCreeper.exe
                  retention-days: 30

    build-macos:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pyinstaller

            - name: Build with PyInstaller
              run: |
                  pyinstaller --name="TransCreeper" \
                              --windowed \
                              --onefile \
                              --icon=resources/icon.icns \
                              --add-data="resources:resources" \
                              --osx-bundle-identifier=com.transcreeper.app \
                              src/main.py

            - name: Create DMG
              run: |
                  mkdir -p dist/dmg
                  cp -r "dist/TransCreeper.app" dist/dmg/
                  ln -s /Applications dist/dmg/Applications
                  hdiutil create -volname "TransCreeper" \
                                 -srcfolder dist/dmg \
                                 -ov \
                                 -format UDZO \
                                 dist/TransCreeper-macOS.dmg

            - name: Upload macOS artifact
              uses: actions/upload-artifact@v4
              with:
                  name: TransCreeper-macOS
                  path: dist/TransCreeper-macOS.dmg
                  retention-days: 30

    build-linux:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y portaudio19-dev python3-pyqt6

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pyinstaller

            - name: Build with PyInstaller
              run: |
                  pyinstaller --name="TransCreeper" \
                              --windowed \
                              --onefile \
                              --add-data="resources:resources" \
                              src/main.py

            - name: Create AppImage
              run: |
                  wget -c https://github.com/$(wget -q https://github.com/probonopd/go-appimage/releases -O - | grep "appimagetool-.*-x86_64.AppImage" | head -n 1 | cut -d '"' -f 2)
                  chmod +x appimagetool-*.AppImage

                  mkdir -p AppDir/usr/bin
                  mkdir -p AppDir/usr/share/applications
                  mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

                  cp dist/TransCreeper AppDir/usr/bin/

                  cat > AppDir/usr/share/applications/transcreeper.desktop <<EOL
                  [Desktop Entry]
                  Name=TransCreeper
                  Exec=TransCreeper
                  Icon=transcreeper
                  Type=Application
                  Categories=Utility;AudioVideo;
                  EOL

                  # TODO: Add icon
                  # cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/transcreeper.png

                  ./appimagetool-*.AppImage AppDir dist/TransCreeper-Linux.AppImage

            - name: Upload Linux artifact
              uses: actions/upload-artifact@v4
              with:
                  name: TransCreeper-Linux
                  path: dist/TransCreeper-Linux.AppImage
                  retention-days: 30
